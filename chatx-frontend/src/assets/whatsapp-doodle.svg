<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="wa-pattern" width="200" height="200" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#8696a0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.08">
        <!-- Chat Bubble -->
        <path d="M25 25 h20 a5 5 0 0 1 5 5 v10 a5 5 0 0 1 -5 5 h-12 l-6 5 v-5 h-2 a5 5 0 0 1 -5 -5 v-10 a5 5 0 0 1 5 -5 z" />
        
        <!-- Heart -->
        <path d="M85 30 a4 4 0 0 0 -6 0 l-2 2 l-2 -2 a4 4 0 0 0 -6 6 l8 8 l8 -8 a4 4 0 0 0 0 -6 z" />

        <!-- Camera -->
        <rect x="135" y="24" width="22" height="16" rx="3" />
        <circle cx="146" cy="32" r="4.5" />
        <path d="M141 24 l2 -3 h6 l2 3" />

        <!-- Headphones -->
        <path d="M25 90 a12 12 0 0 1 24 0 v8 h-3 a3 3 0 0 1 -3 -3 v-3 a3 3 0 0 1 3 -3 h3" />
        <path d="M49 98 h-3 a3 3 0 0 1 -3 -3 v-3 a3 3 0 0 1 3 -3 h3" />

        <!-- Coffee Cup -->
        <path d="M80 82 h16 v10 a6 6 0 0 1 -6 6 h-4 a6 6 0 0 1 -6 -6 v-10 z" />
        <path d="M96 85 h3 a3 3 0 0 1 3 3 v1 a3 3 0 0 1 -3 3 h-3" />
        <path d="M78 100 h20" />

        <!-- Lock -->
        <rect x="140" y="86" width="16" height="12" rx="2" />
        <path d="M144 86 v-4 a4 4 0 0 1 8 0 v4" />
        <circle cx="148" cy="92" r="1.5" />

        <!-- Star -->
        <polygon points="35,140 38,147 45,148 40,153 41,160 35,156 29,160 30,153 25,148 32,147" />

        <!-- Paper Airplane -->
        <path d="M85 145 l18 -8 l-8 18 l-3 -7 z" />
        <path d="M94 148 l-9 8" />

        <!-- Microphone -->
        <rect x="142" y="140" width="8" height="14" rx="4" />
        <path d="M138 147 a8 8 0 0 0 16 0" />
        <path d="M146 155 v5 m-4 0 h8" />

        <!-- Music Note -->
        <path d="M185 30 v12 a3 3 0 1 1 -3 -3 h3" />
        
        <!-- Smiley -->
        <circle cx="35" cy="185" r="9" />
        <circle cx="32" cy="183" r="1" fill="#8696a0" />
        <circle cx="38" cy="183" r="1" fill="#8696a0" />
        <path d="M31 187 a5 5 0 0 0 8 0" />

        <!-- Gift Box -->
        <rect x="85" y="180" width="16" height="14" rx="2" />
        <line x1="85" y1="185" x2="101" y2="185" />
        <line x1="93" y1="180" x2="93" y2="194" />

        <!-- Globe / Location pin -->
        <circle cx="148" cy="185" r="6" />
        <line x1="142" y1="185" x2="154" y2="185" />
        <ellipse cx="148" cy="185" rx="3" ry="6" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#wa-pattern)" />
</svg>
