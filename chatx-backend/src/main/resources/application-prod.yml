spring:
  datasource:
    url: jdbc:mysql://${CHATX_DB_HOST:localhost}:${CHATX_DB_PORT:3306}/${CHATX_DB_NAME:chatx_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8mb4
    username: ${CHATX_DB_USERNAME:chatx_user}
    password: ${CHATX_DB_PASSWORD:chatx_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${CHATX_REDIS_HOST:localhost}
      port: ${CHATX_REDIS_PORT:6379}

logging:
  level:
    com.chatx: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
