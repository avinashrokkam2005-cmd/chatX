spring:
  # DataSource
  datasource:
    url: jdbc:mysql://${CHATX_DB_HOST:localhost}:${CHATX_DB_PORT:3306}/${CHATX_DB_NAME:chatx_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${CHATX_DB_USERNAME:chatx_user}
    password: ${CHATX_DB_PASSWORD:chatx_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  # JPA - use update for dev, validate for prod
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis
  data:
    redis:
      host: ${CHATX_REDIS_HOST:localhost}
      port: ${CHATX_REDIS_PORT:6379}

# Dev logging
logging:
  level:
    com.chatx: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Swagger in dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

server:
  port: ${CHATX_SERVER_PORT:8088}
